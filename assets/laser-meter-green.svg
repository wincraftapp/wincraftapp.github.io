<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 460" role="img" aria-label="Bluetooth laser measure: width 1.621 m, then height 1.324 m">
  <!-- Drawn from a photo of a green-laser Bluetooth distance meter. No maker's name or logo, on purpose. -->
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2c3a46"/><stop offset=".5" stop-color="#3e4f5d"/><stop offset="1" stop-color="#27343f"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34495a"/><stop offset="1" stop-color="#2a3b49"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2126"/><stop offset=".5" stop-color="#0c0f12"/><stop offset="1" stop-color="#171c20"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#27e06a"/><stop offset="1" stop-color="#27e06a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f6f93"/><stop offset="1" stop-color="#2d5574"/>
    </linearGradient>
  </defs>

  <!-- green beam -->
  <rect x="108.5" y="0" width="3" height="50" fill="url(#beam)"/>

  <!-- rubber shell with ribbed shoulders -->
  <path d="M52 44 h116 l22 20 v352 a26 26 0 0 1 -26 26 h-108 a26 26 0 0 1 -26 -26 v-352 z" fill="url(#shell)" stroke="#1c262e" stroke-width="2"/>
  <g stroke="#1c262e" stroke-width="3" stroke-linecap="round">
    <path d="M32 96 h8 M32 108 h8 M32 120 h8 M32 132 h8 M32 144 h8 M32 156 h8"/>
    <path d="M180 96 h8 M180 108 h8 M180 120 h8 M180 132 h8 M180 144 h8 M180 156 h8"/>
  </g>
  <rect x="96" y="40" width="28" height="8" rx="2" fill="#0d1114"/>

  <!-- display window -->
  <path d="M60 58 h100 l14 14 v164 a10 10 0 0 1 -10 10 h-108 a10 10 0 0 1 -10 -10 v-164 z" fill="#0f1418" stroke="#1c262e" stroke-width="1.5"/>
  <rect x="62" y="92" width="96" height="118" rx="4" fill="url(#glass)"/>
  <path d="M66 96 l40 0 l-40 60 z" fill="#fff" opacity=".05"/>
  <!-- readout: the same two sizes the rest of the page uses -->
  <g font-family="'Segoe UI', Roboto, sans-serif" fill="#e9f0f5">
    <text x="70" y="118" font-size="8" opacity=".6">1 Width</text><text x="70" y="132" font-size="12" opacity=".85">1.621 m</text>
    <line x1="70" y1="142" x2="150" y2="142" stroke="#e9f0f5" stroke-opacity=".25"/>
    <text x="70" y="156" font-size="8" opacity=".6">2 Height</text>
    <text x="140" y="190" font-size="26" font-weight="700" text-anchor="end" fill="#27e06a">1.324</text><text x="150" y="190" font-size="9" text-anchor="end">m</text>
  </g>

  <!-- speaker-like grip texture beside the main key -->
  <g fill="#1f2c36">
    <rect x="50" y="262" width="30" height="46" rx="4"/><rect x="140" y="262" width="30" height="46" rx="4"/>
  </g>

  <!-- measure key: green ring and triangle -->
  <rect x="88" y="262" width="44" height="44" rx="9" fill="#12181c" stroke="#27e06a" stroke-width="4"/>
  <path d="M110 273 l12 20 h-24 z" fill="#27e06a"/>

  <!-- keypad plate -->
  <path d="M46 322 h128 v84 a20 20 0 0 1 -20 20 h-88 a20 20 0 0 1 -20 -20 z" fill="url(#face)" stroke="#1c262e" stroke-width="1.5"/>
  <!-- row 1: minus, Func, plus -->
  <rect x="52" y="330" width="36" height="30" rx="8" fill="url(#key)"/>
  <circle cx="110" cy="345" r="17" fill="#22323f" stroke="#17222b"/>
  <rect x="132" y="330" width="36" height="30" rx="8" fill="url(#key)"/>
  <path d="M60 345 l11 -7 v14 z M76 345 h6" fill="#e9f0f5" stroke="#e9f0f5" stroke-width="2" stroke-linejoin="round"/>
  <path d="M160 345 l-11 -7 v14 z M138 345 h6 M141 342 v6" fill="#e9f0f5" stroke="#e9f0f5" stroke-width="2" stroke-linejoin="round"/>
  <text x="110" y="349" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#e9f0f5" text-anchor="middle">Func</text>
  <!-- row 2: Bluetooth, back and power, settings -->
  <rect x="52" y="372" width="36" height="34" rx="9" fill="url(#key)"/>
  <rect x="92" y="368" width="36" height="46" rx="9" fill="#22323f" stroke="#17222b"/>
  <rect x="132" y="372" width="36" height="34" rx="9" fill="url(#key)"/>
  <path d="M64 382 l12 10 -6 5 v-18 l6 5 -12 10" fill="none" stroke="#e9f0f5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M103 378 h9 a4 4 0 0 1 0 8 h-8 M107 375 l-4 3 4 3" fill="none" stroke="#e9f0f5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="110" cy="401" r="7" fill="#e5281e"/>
  <path d="M110 396 v5 M106.5 398.5 a5 5 0 1 0 7 0" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
  <g transform="translate(150 389)" fill="#e9f0f5">
    <circle r="6.5"/>
    <g id="t"><rect x="-2" y="-10" width="4" height="5" rx="1"/></g>
    <use href="#t" transform="rotate(60)"/><use href="#t" transform="rotate(120)"/><use href="#t" transform="rotate(180)"/><use href="#t" transform="rotate(240)"/><use href="#t" transform="rotate(300)"/>
    <circle r="2.6" fill="#2d5574"/>
  </g>
  <!-- case screws -->
  <circle cx="60" cy="420" r="3" fill="#1c262e"/><circle cx="160" cy="420" r="3" fill="#1c262e"/>
</svg>
